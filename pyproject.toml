[project]
name = "instalilyxdeepmind"
version = "0.1.0"
description = "Multi-agent code-repair harness for the DeepMind x InstaLILY Toronto hackathon"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
swebench = ["datasets>=2.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.providers", "roles", "tasks", "eval", "tracing"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
